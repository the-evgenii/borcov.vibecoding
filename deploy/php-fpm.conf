[global]
pid = /opt/vibecoding-marketing/run/php-fpm.pid
error_log = /opt/vibecoding-marketing/logs/php-fpm.log
log_level = warning
daemonize = no
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
user = vibecoding
group = vibecoding
listen = /opt/vibecoding-marketing/run/php-fpm.sock
listen.owner = vibecoding
listen.group = vibecoding
listen.mode = 0660
pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 1
pm.max_requests = 200
chdir = /opt/vibecoding-marketing/app
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 60s
security.limit_extensions = .php
php_admin_value[error_log] = /opt/vibecoding-marketing/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 4M
php_admin_value[upload_tmp_dir] = /opt/vibecoding-marketing/tmp
php_admin_value[session.save_path] = /opt/vibecoding-marketing/app/runtime/sessions
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
